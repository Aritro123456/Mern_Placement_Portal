name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /Mern_Placement_Portal/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_REQUIRE_API: 'true'
      - name: Support direct React route links
        run: cp client/dist/index.html client/dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v5
